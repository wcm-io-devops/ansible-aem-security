---
- name: "Test authentication with old/current password for '{{ aem_security_admin_user }}'"
  ansible.builtin.uri:
    url: "{{ aem_security_url_password_check }}"
    method: GET
    user: "{{ aem_security_admin_user }}"
    password: "{{ aem_security_admin_password_old }}"
    force_basic_auth: yes
    status_code:
      - "{{ aem_security_url_password_valid_code }}"
      - "{{ aem_security_url_password_invalid_code }}"
  register: _check_old_password_result

- name: "Test authentication with new password for '{{ aem_security_admin_user }}'"
  ansible.builtin.uri:
    url: "{{ aem_security_url_password_check }}"
    method: GET
    user: "{{ aem_security_admin_user }}"
    password: "{{ aem_security_admin_password_new }}"
    force_basic_auth: yes
    status_code:
      - "{{ aem_security_url_password_valid_code }}"
      - "{{ aem_security_url_password_invalid_code }}"
  register: _check_new_password_result
  failed_when:
    - _check_new_password_result.status != aem_security_url_password_valid_code
  when:
    - _check_old_password_result.status != aem_security_url_password_valid_code

# change password when authentication with old/current was successful,
# new password is available and different to current one
- name: "Change password for '{{ aem_security_admin_user }}'"
  when: _check_old_password_result.status == aem_security_url_password_valid_code
  block:
    - name: "Get user path of '{{ aem_security_admin_user }}'"
      ansible.builtin.uri:
        url: "{{ aem_security_url_userinfo }}"
        method: GET
        user: "{{ aem_security_admin_user }}"
        password: "{{ aem_security_admin_password_old }}"
        force_basic_auth: yes
      register: _query_user_result

    # /crx/explorer/ui/setpassword.jsp is gone on AEMaaCS/Cloud SDK (JSP-based
    # CRX Explorer UI is no longer shipped/functional there), so the password
    # is set by posting the rep:password property directly to the user's JCR
    # node via the standard Sling default POST servlet. This works on both
    # classic AEM (6.5/6.5 LTS) and AEMaaCS/Cloud SDK.
    - name: "Set new password for '{{ aem_security_admin_user }}'"
      ansible.builtin.uri:
        url: "{{ aem_security_url_base }}{{ _query_user_result.json.hits[0].path }}"
        method: POST
        user: "{{ aem_security_admin_user }}"
        password: "{{ aem_security_admin_password_old }}"
        body_format: form-urlencoded
        body:
          "rep:password": "{{ aem_security_admin_password_new }}"
        force_basic_auth: yes
        status_code: 200
      register: _set_password_result
      # this block only runs when the old password check succeeded and new != old
      # (see main.yml/outer when), so reaching this task always means a change
      changed_when: true

    # the Sling default POST servlet response does not reliably reflect
    # whether the protected rep:password property was actually applied, so
    # verify by authenticating with the new password.
    - name: "Verify new password is active for '{{ aem_security_admin_user }}'"
      ansible.builtin.uri:
        url: "{{ aem_security_url_password_check }}"
        method: GET
        user: "{{ aem_security_admin_user }}"
        password: "{{ aem_security_admin_password_new }}"
        force_basic_auth: yes
        status_code: "{{ aem_security_url_password_valid_code }}"
      register: _verify_new_password_result
